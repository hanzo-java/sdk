# Canonical caller — every knob lives in /hanzo.yml, none here.
#
# hanzo-inc/cloud's release dispatches this with the commit it deployed and that
# release's version; hanzoai/ci's client lane regenerates from openapi.yaml at
# that ref, gates it, and cuts that version. Dispatched with no inputs, it checks
# the committed client and writes nothing.
#
# The permissions are what the reusable declares. The ID token is the run's own
# credential: hanzoai/ci exchanges it at IAM for the CI identity cloud's
# IAM_REPOSITORIES maps this org to, so the repository stores no KMS secret.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "cloud commit to move .spec-lock to. Empty = check, write nothing."
        required: false
        default: ''
      spec-version:
        description: "Version to cut this projection at. Empty = derive the next patch."
        required: false
        default: ''
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      spec-ref: ${{ github.event.inputs.spec-ref || '' }}
      spec-version: ${{ github.event.inputs.spec-version || '' }}
    secrets: inherit
